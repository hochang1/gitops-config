apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: gitops-app-dev
namePrefix: dev-
# commonLabels:
#   env: dev
labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app: gitops-app
    env: dev
images:
- name: gitops-app
  newName: hochang1/gitops-app
  newTag: sha-fcbc22e
- name: nginx
  newName: your-dockerhub-username/gitops-app
  newTag: sha-4b9624c
replicas:
- count: 1
  name: gitops-app
