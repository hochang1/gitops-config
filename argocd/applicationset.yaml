apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ops-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: ops-app1
                  port: "8080"
                - app: ops-app2
                  port: "8081"
          - list:
              elements:
                - env: dev
                  replicas: "1"
                - env: staging
                  replicas: "2"
                - env: prod
                  replicas: "3"
  template:
    metadata:
      name: "{{.app}}-{{.env}}"
      namespace: argocd
    spec:
      project: gitops-project
      source:
        repoURL: https://github.com/hochang1/gitops-config
        targetRevision: main
        path: "apps/{{.app}}/overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.app}}-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
